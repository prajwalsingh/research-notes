<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>note — notebook</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/css/style.css">

<!-- Markdown, math, and code rendering — pinned CDN versions, no build step -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/nord.min.css">
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.0/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body>

<header class="masthead">
  <div class="masthead-row">
    <a class="wordmark" href="index.html"><span class="glyph">λ</span>notebook<span class="sub">/ research notes</span></a>
    <div class="masthead-tools">
      <button class="theme-toggle" id="themeToggle" type="button">dark</button>
    </div>
  </div>
  <div class="trace-wrap" id="trace"></div>
</header>

<main class="note-layout" id="noteLayout">
  <div class="note-header">
    <a class="back-link" href="index.html">&larr; notebook</a>
    <div class="note-header-meta" id="noteMeta"></div>
    <h1 id="noteTitle">loading…</h1>
  </div>

  <nav class="note-toc" id="noteToc" aria-label="On this page">
    <div class="note-toc-label">On this page</div>
    <ol id="tocList"></ol>
  </nav>

  <article class="note-body" id="noteBody">
    <p class="loading">fetching note…</p>
  </article>

  <div class="note-footer">
    <span id="footerSlug"></span>
    <a href="index.html">back to all notes →</a>
  </div>
</main>

<script src="assets/js/common.js"></script>
<script src="assets/js/note.js"></script>
</body>
</html>
